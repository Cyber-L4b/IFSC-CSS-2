<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade 3</title>

    <style>
        *{
            padding: 0;
            margin: 0;
        }

        .base div{
            border: 1px solid black;
            
            display: flex;
            justify-content: center; 
            align-items: center;     
            font-size: 2rem;        
            font-family: sans-serif;
            border-radius: 30px;
        }

        .base{
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            grid-template-areas: 
            "caixa1 caixa1 caixa1"
            "caixa2 caixa3 caixa4"
            "caixa5 caixa3 caixa6"
            "caixa5 caixa7 caixa7";
            gap: 15px;
            height: 100vh;
            width: 150vh;
            padding: 10px;
        }

        .caixa1{
            grid-area: caixa1;
            background-color:orange;
        }

        .caixa2{
            grid-area: caixa2;
            background-color:red;
        }

        .caixa3{
            grid-area: caixa3;
            background-color:orange;
        }

        .caixa4{
            grid-area: caixa4;
            background-color:red;
        }

        .caixa5{
            grid-area: caixa5;
            background-color:orange;
        }

        .caixa6{
            grid-area: caixa6;
            background-color:red;
        }

        .caixa7{
            grid-area: caixa7;
            background-color:orange;
        }


    </style>

</head>
<body>
    <div class="base">

        <div class="caixa1">1</div>
        <div class="caixa2">2</div>
        <div class="caixa3">3</div>
        <div class="caixa4">4</div>
        <div class="caixa5">5</div>
        <div class="caixa6">6</div>
        <div class="caixa7">7</div>
    </div>

    
</body>
</html>
