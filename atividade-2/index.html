<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade</title>

    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            background-color: black;
        }

        .container{
            display: flex;
            width: 100%;
            height: 400px; 
            gap: 10px;
        }

        img{
        margin-top: 1rem;
        flex: 1;                
        height: 100%;
        object-fit: cover;       
        transition: flex 0.5s ease;

        min-width: 0;
        object-fit: cover;
        border-radius: 20px;
        

        }

        .container img:hover {
            flex: 4;                 /* Ela cresce e passa a ocupar 3 vezes mais espaço que as outras */
        }
    </style>
</head>
<body>

    <div class="container" >
        <img src="img1.jpg" alt="">
        <img src="img2.jpg" alt="">
        <img src="img3.jpg" alt="">
        <img src="img4.jpg" alt="">
        <img src="img5.jpg" alt="">
    </div>
    
</body>
</html>
